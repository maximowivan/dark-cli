[package]
name = "dark-cli"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "dark-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
fuzzy-matcher = "0.3.7"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
oem_cp = "2.1.2"
