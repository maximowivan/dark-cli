# Конфигурационный файл Dark CLI / Launcher
# Вы можете свободно добавлять сюда любые свои команды и скрипты!

[settings]
# default_cwd = "C:\\projects"
# shell = "powershell" # или "cmd"

[zapret]
path = "C:\\zapret"
service_name = "zapret"
github_repo = "Flowseal/zapret-discord-youtube"

[tg_proxy]
path = "C:\\Users\\maxim\\Downloads\\TgWsProxy_windows.exe"
github_repo = "Flowseal/tg-ws-proxy"
default_port = 1443

[[actions]]
id = "zapret-status"
name = "Статус Zapret"
description = "Проверка состояния службы, процессов winws, текущей стратегии и обновлений"
category = "Zapret"
command = "dark-cli zapret status"
shortcut = "s"

[[actions]]
id = "zapret-easy-setup"
name = "Мастер настройки под ключ (1 клик)"
description = "Полная автонастройка для нового ПК: установка в C:\\zapret, тест всех стратегий утилитой utils, запуск службы и проверка"
category = "Zapret"
command = "dark-cli zapret easy-setup"
shortcut = "a"

[[actions]]
id = "zapret-start"
name = "Запустить службу Zapret"
description = "Запуск системной службы обхода блокировок (net start zapret, без окон консоли)"
category = "Zapret"
command = "dark-cli zapret start"
shortcut = "1"

[[actions]]
id = "zapret-stop"
name = "Остановить службу Zapret"
description = "Остановка системной службы zapret и процессов winws.exe"
category = "Zapret"
command = "dark-cli zapret stop"
shortcut = "0"

[[actions]]
id = "zapret-restart"
name = "Перезапустить службу Zapret"
description = "Быстрый перезапуск службы обходчика (stop -> wait -> start)"
category = "Zapret"
command = "dark-cli zapret restart"
shortcut = "r"

[[actions]]
id = "zapret-service-install"
name = "Установить / Сменить стратегию службы"
description = "Регистрация службы Windows с выбором стратегии (по умолчанию general ALT11)"
category = "Zapret"
command = "dark-cli zapret service-install"
shortcut = "e"

[[actions]]
id = "zapret-service-remove"
name = "Удалить службу Windows"
description = "Полное удаление системной службы zapret из Windows (sc delete zapret)"
category = "Zapret"
command = "dark-cli zapret service-remove"
shortcut = "x"

[[actions]]
id = "zapret-update"
name = "Обновить / Установить Zapret"
description = "Скачать последний релиз с GitHub, сохранить списки пользователей, обновить файлы и запустить"
category = "Zapret"
command = "dark-cli zapret update"
shortcut = "u"

[[actions]]
id = "zapret-install"
name = "Установить / Выбрать папку"
description = "Выбрать папку для установки Zapret (по умолчанию C:\\zapret или указать свой путь)"
category = "Zapret"
command = "dark-cli zapret install"
shortcut = "i"

[[actions]]
id = "zapret-open"
name = "Открыть папку Zapret"
description = "Открыть рабочую директорию Zapret в Проводнике Windows"
category = "Zapret"
command = "dark-cli zapret open"
shortcut = "o"

[[actions]]
id = "zapret-manager"
name = "Service.bat (Менеджер)"
description = "Запустить оригинальный service.bat от имени администратора для настройки стратегий"
category = "Zapret"
command = "dark-cli zapret manager"
shortcut = "m"

# ==========================================================
# ДЕЙСТВИЯ: FLOWSEAL TG WS PROXY (TELEGRAM)
# ==========================================================

[[actions]]
id = "tg-proxy-status"
name = "Статус TG WS Proxy"
description = "Проверка процесса, порта 1443, файла настроек, ключа secret и релизов"
category = "Telegram Proxy"
command = "dark-cli tg-proxy status"
shortcut = "s"

[[actions]]
id = "tg-proxy-start"
name = "Запустить TG WS Proxy"
description = "Запуск MTProto WS прокси в фоновом режиме (появится иконка в трее Windows)"
category = "Telegram Proxy"
command = "dark-cli tg-proxy start"
shortcut = "1"

[[actions]]
id = "tg-proxy-stop"
name = "Остановить TG WS Proxy"
description = "Завершение всех активных процессов TgWsProxy_windows.exe"
category = "Telegram Proxy"
command = "dark-cli tg-proxy stop"
shortcut = "0"

[[actions]]
id = "tg-proxy-restart"
name = "Перезапустить TG WS Proxy"
description = "Быстрый перезапуск прокси для сброса активных сессий или применения конфига"
category = "Telegram Proxy"
command = "dark-cli tg-proxy restart"
shortcut = "r"

[[actions]]
id = "tg-proxy-connect"
name = "Подключить в Telegram (1 клик)"
description = "Мгновенное открытие окна подтверждения подключения прокси в Telegram Desktop (tg://proxy)"
category = "Telegram Proxy"
command = "dark-cli tg-proxy connect"
shortcut = "c"

[[actions]]
id = "tg-proxy-copy-link"
name = "Скопировать ссылку прокси"
description = "Скопировать готовую ссылку tg://proxy в буфер обмена Windows"
category = "Telegram Proxy"
command = "dark-cli tg-proxy copy-link"
shortcut = "y"

[[actions]]
id = "tg-proxy-update"
name = "Обновить / Скачать с GitHub"
description = "Скачивание актуального релиза TgWsProxy_windows.exe с официального репозитория Flowseal"
category = "Telegram Proxy"
command = "dark-cli tg-proxy update"
shortcut = "u"

[[actions]]
id = "tg-proxy-logs"
name = "Журнал прокси (proxy.log)"
description = "Просмотр последних строк журнала событий proxy.log прямо в окне вывода"
category = "Telegram Proxy"
command = "dark-cli tg-proxy logs"
shortcut = "l"

[[actions]]
id = "tg-proxy-open"
name = "Открыть папку с прокси"
description = "Открыть каталог с исполняемым файлом и логами в Проводнике Windows"
category = "Telegram Proxy"
command = "dark-cli tg-proxy open"
shortcut = "o"

# ==========================================================
# ДЕЙСТВИЯ: DARK-CLI (СИСТЕМА И ОБНОВЛЕНИЯ)
# ==========================================================

[[actions]]
id = "dark-cli-self-update"
name = "Обновить Dark-CLI"
description = "Проверка наличия обновлений Dark-CLI на GitHub (maximowivan/dark-cli) и установка в 1 клик"
category = "Dark-CLI"
command = "dark-cli self-update"
shortcut = "u"

# ==========================================================
# ДЕЙСТВИЯ: АВТОЗАГРУЗКА И СИСТЕМНЫЙ ТРЕЙ
# ==========================================================

[[actions]]
id = "sys-status"
name = "Статус автозагрузки и трея"
description = "Проверка автозапуска Dark-CLI, TG WS Proxy и системной службы Zapret"
category = "Автозагрузка и Трей"
command = "dark-cli system status"
shortcut = "s"

[[actions]]
id = "sys-tray-hide"
name = "Свернуть окно в системный трей"
description = "Мгновенно скрыть окно консоли в трей возле часов (или нажмите [h] в меню)"
category = "Автозагрузка и Трей"
command = "dark-cli system tray-hide"
shortcut = "h"

[[actions]]
id = "sys-dark-cli-autorun-enable"
name = "Включить автозапуск Dark-CLI"
description = "Запуск Dark-CLI свернутым в системный трей при включении Windows"
category = "Автозагрузка и Трей"
command = "dark-cli system autorun-enable"
shortcut = "1"

[[actions]]
id = "sys-dark-cli-autorun-disable"
name = "Отключить автозапуск Dark-CLI"
description = "Удаление Dark-CLI из автозагрузки Windows"
category = "Автозагрузка и Трей"
command = "dark-cli system autorun-disable"
shortcut = "0"

[[actions]]
id = "sys-tg-autorun-enable"
name = "Включить автозапуск TG WS Proxy"
description = "Автоматический запуск прокси для Telegram в фоне при включении Windows"
category = "Автозагрузка и Трей"
command = "dark-cli system tg-autorun-enable"
shortcut = "2"

[[actions]]
id = "sys-tg-autorun-disable"
name = "Отключить автозапуск TG WS Proxy"
description = "Удаление Flowseal TG WS Proxy из автозагрузки Windows"
category = "Автозагрузка и Трей"
command = "dark-cli system tg-autorun-disable"
shortcut = "9"
